services:
  web:
    build: .
    container_name: diplom
    command: python diplom/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${DB_PORT}:${DB_PORT}"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: django_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  postgres_data: